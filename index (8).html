<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIgram — AI 친구와 대화하세요</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f3f0;
  --white: #ffffff;
  --border: #e8e4de;
  --text: #1a1a1a;
  --text-muted: #9e9a94;
  --accent: #ff4757;
  --accent2: #2f3542;
  --bubble-me: #1a1a1a;
  --bubble-them: #ffffff;
  --story-ring: conic-gradient(from 0deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3, #ff6b6b);
  --shadow: 0 2px 20px rgba(0,0,0,0.08);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:'DM Sans', sans-serif;
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  justify-content: center;
}

/* ============================
   LAYOUT
============================ */
.app {
  width: 100%;
  max-width: 960px;
  display: grid;
  grid-template-columns: 232px 1fr 288px;
  gap: 0;
  min-height: 100vh;
}

/* ============================
   LEFT NAV
============================ */
.left-nav {
  padding: 20px 12px;
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  gap: 2px;
  border-right: 1px solid var(--border);
  background: var(--white);
}
.logo {
  font-family: 'Instrument Serif', serif;
  font-size: 28px;
  font-style: italic;
  color: var(--text);
  padding: 8px 12px 20px;
  letter-spacing: -1px;
}
.logo span { color: var(--accent); }
.nav-btn {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 11px 14px;
  border-radius: 10px;
  border: none;
  background: none;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  transition: background 0.15s;
  text-align: left;
  width: 100%;
}
.nav-btn:hover { background: var(--bg); }
.nav-btn.active { font-weight: 700; }
.nav-btn.active .nav-icon { background: var(--text); color: #fff; }
.nav-icon {
  width: 34px; height: 34px;
  border-radius: 10px;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
  transition: background 0.15s;
}
.nav-spacer { flex: 1; }
.new-char-btn {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px;
  border-radius: 12px;
  border: 2px dashed var(--border);
  background: none;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
  transition: all 0.15s;
  width: 100%;
  margin-top: 8px;
}
.new-char-btn:hover { border-color: var(--accent); color: var(--accent); background: #fff0f1; }

/* ============================
   MAIN AREA (DM list + Chat)
============================ */
.main {
  display: flex;
  flex-direction: column;
  background: var(--white);
  border-right: 1px solid var(--border);
}

/* Stories */
.stories-bar {
  padding: 16px 0 16px 16px;
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  scrollbar-width: none;
  flex-shrink: 0;
}
.stories-bar::-webkit-scrollbar { display: none; }
.stories-row { display: flex; gap: 14px; align-items: center; }
.story-wrap {
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  cursor: pointer; flex-shrink: 0;
}
.story-ring {
  width: 60px; height: 60px;
  border-radius: 50%;
  background: var(--story-ring);
  padding: 2.5px;
  transition: transform 0.2s;
}
.story-ring:hover { transform: scale(1.06); }
.story-ring.no-ring { background: var(--border); }
.story-inner {
  width: 100%; height: 100%;
  border-radius: 50%;
  border: 2.5px solid white;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  overflow: hidden;
  position: relative;
}
.story-name {
  font-size: 10px; font-weight: 500; color: var(--text);
  max-width: 64px; text-align: center;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* DM list tabs */
.dm-section {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.dm-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--border);
}
.dm-title { font-size: 16px; font-weight: 700; }
.dm-new-btn {
  width: 32px; height: 32px; border-radius: 50%;
  border: none; background: var(--bg);
  cursor: pointer; font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.dm-new-btn:hover { background: var(--border); }
.dm-list { flex: 1; overflow-y: auto; padding: 6px 0; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }

/* DM Item */
.dm-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px;
  cursor: pointer;
  border-radius: 0;
  transition: background 0.12s;
  position: relative;
}
.dm-item:hover { background: var(--bg); }
.dm-item.active { background: #f5f3f0; }
.dm-item.active::before {
  content: '';
  position: absolute; left: 0; top: 8px; bottom: 8px;
  width: 3px; border-radius: 0 3px 3px 0;
  background: var(--text);
}
.dm-avatar {
  width: 48px; height: 48px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  position: relative;
}
.dm-avatar-ring {
  width: 52px; height: 52px;
  border-radius: 50%;
  background: var(--story-ring);
  padding: 2px;
  flex-shrink: 0;
}
.dm-info { flex: 1; min-width: 0; }
.dm-name { font-size: 14px; font-weight: 700; }
.dm-preview { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.dm-time { font-size: 10px; color: var(--text-muted); flex-shrink: 0; }
.dm-unread {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent); flex-shrink: 0;
}

/* ============================
   CHAT VIEW (overlays main on mobile, right panel on desktop)
============================ */
.chat-view {
  display: none;
  flex-direction: column;
  height: 100%;
  position: absolute;
  inset: 0;
  background: var(--white);
  z-index: 10;
}
.chat-view.open { display: flex; }

/* Chat is embedded in right column on desktop */
@media (min-width: 700px) {
  .chat-view {
    display: flex !important;
    position: static;
    height: auto;
    flex: 1;
  }
  .dm-section { display: flex; }
}

.chat-header {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  background: var(--white);
}
.back-btn {
  background: none; border: none; cursor: pointer; font-size: 20px;
  display: none; padding: 4px 8px 4px 0;
}
.chat-h-avatar {
  width: 40px; height: 40px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex-shrink: 0;
}
.chat-h-info { flex: 1; }
.chat-h-name { font-size: 14px; font-weight: 700; }
.chat-h-sub { font-size: 11px; color: var(--text-muted); }
.chat-h-actions { display: flex; gap: 10px; }
.h-btn {
  width: 34px; height: 34px; border-radius: 50%;
  border: none; background: none; cursor: pointer; font-size: 18px;
  transition: background 0.15s;
}
.h-btn:hover { background: var(--bg); }

.msgs-area {
  flex: 1; overflow-y: auto;
  padding: 16px;
  display: flex; flex-direction: column; gap: 3px;
  scrollbar-width: thin; scrollbar-color: var(--border) transparent;
}

.date-sep {
  display: flex; align-items: center; gap: 10px;
  font-size: 11px; color: var(--text-muted);
  margin: 10px 0 4px;
}
.date-sep::before, .date-sep::after { content:''; flex:1; height:1px; background: var(--border); }

.msg-row {
  display: flex; align-items: flex-end; gap: 8px;
  animation: popIn 0.2s ease;
}
@keyframes popIn {
  from { opacity: 0; transform: translateY(6px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.msg-row.me { flex-direction: row-reverse; }

.msg-av {
  width: 26px; height: 26px; border-radius: 50%;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
}
.msg-av.hidden { visibility: hidden; }

.bwrap { display: flex; flex-direction: column; gap: 1px; max-width: 72%; }
.msg-row.me .bwrap { align-items: flex-end; }

.bubble {
  padding: 9px 14px;
  border-radius: 20px;
  font-size: 14px; line-height: 1.55;
  word-break: break-word;
  position: relative;
}
.bubble.them {
  background: var(--bubble-them);
  color: var(--text);
  border: 1px solid var(--border);
  border-bottom-left-radius: 5px;
}
.bubble.me {
  background: var(--bubble-me);
  color: #fff;
  border-bottom-right-radius: 5px;
}
.msg-time { font-size: 10px; color: var(--text-muted); padding: 0 3px; }

.typing-bub { padding: 13px 16px; }
.dots { display: flex; gap: 4px; align-items: center; }
.dots span {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--text-muted);
  animation: dot-bounce 1.4s infinite;
}
.dots span:nth-child(2) { animation-delay: 0.16s; }
.dots span:nth-child(3) { animation-delay: 0.32s; }
@keyframes dot-bounce {
  0%,60%,100% { transform: translateY(0); }
  30% { transform: translateY(-5px); }
}

/* Input bar */
.input-bar {
  border-top: 1px solid var(--border);
  padding: 12px 14px;
  display: flex; align-items: center; gap: 10px;
  background: var(--white);
  flex-shrink: 0;
}
.input-wrap {
  flex: 1;
  display: flex; align-items: center;
  border: 1.5px solid var(--border);
  border-radius: 24px;
  padding: 8px 14px;
  gap: 8px;
  transition: border-color 0.2s;
  background: var(--bg);
}
.input-wrap:focus-within { border-color: var(--text); background: #fff; }
#chat-input {
  flex: 1; border: none; background: none; outline: none;
  font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--text);
  resize: none; max-height: 100px; min-height: 20px; line-height: 1.5;
}
#chat-input::placeholder { color: var(--text-muted); }
.send-btn {
  width: 38px; height: 38px; border-radius: 50%;
  border: none; background: var(--text);
  color: #fff; cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s; flex-shrink: 0;
}
.send-btn:disabled { background: var(--border); cursor: default; }
.send-btn:not(:disabled):hover { background: var(--accent); transform: scale(1.06); }

/* Quick chips */
.chips {
  display: flex; flex-wrap: wrap; gap: 7px;
  padding: 10px 16px 0;
}
.chip {
  background: var(--bg); border: 1.5px solid var(--border);
  border-radius: 20px; padding: 5px 12px;
  font-size: 12px; font-family: 'DM Sans', sans-serif;
  color: var(--text); cursor: pointer; transition: all 0.15s;
  font-weight: 500;
}
.chip:hover { border-color: var(--text); background: #fff; }

/* Empty state */
.chat-empty {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; color: var(--text-muted);
  padding: 40px;
  text-align: center;
}
.chat-empty-icon { font-size: 48px; }
.chat-empty h3 { font-size: 18px; font-weight: 700; color: var(--text); }
.chat-empty p { font-size: 14px; line-height: 1.6; }
.chat-empty .start-btn {
  margin-top: 4px; padding: 10px 24px;
  background: var(--text); color: #fff;
  border: none; border-radius: 24px;
  font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 700;
  cursor: pointer; transition: all 0.15s;
}
.chat-empty .start-btn:hover { background: var(--accent); }

/* ============================
   RIGHT SIDEBAR
============================ */
.right-col {
  padding: 20px 16px;
  position: sticky; top: 0; height: 100vh;
  overflow-y: auto; scrollbar-width: none;
}
.right-col::-webkit-scrollbar { display: none; }
.profile-mini {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 20px;
}
.profile-av {
  width: 44px; height: 44px; border-radius: 50%;
  background: linear-gradient(135deg, #ffecd2, #fcb69f);
  display: flex; align-items: center; justify-content: center; font-size: 20px;
}
.profile-name { font-size: 14px; font-weight: 700; }
.profile-sub { font-size: 12px; color: var(--text-muted); }
.suggest-title {
  font-size: 13px; font-weight: 700; color: var(--text-muted);
  margin-bottom: 14px; margin-top: 8px;
}
.suggest-item {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 14px;
}
.s-av {
  width: 38px; height: 38px; border-radius: 50%;
  flex-shrink: 0; font-size: 18px;
  display: flex; align-items: center; justify-content: center;
}
.s-info { flex: 1; min-width: 0; }
.s-name { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s-sub { font-size: 11px; color: var(--text-muted); }
.s-follow {
  font-size: 12px; font-weight: 700; color: var(--accent);
  border: none; background: none; cursor: pointer; padding: 0;
  font-family: 'DM Sans', sans-serif;
}
.s-follow:hover { text-decoration: underline; }
.s-follow.on { color: var(--text-muted); }

/* ============================
   MODALS
============================ */
.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(6px);
  z-index: 200;
  display: flex; align-items: center; justify-content: center;
  animation: fadeIn 0.15s ease;
}
.overlay.hidden { display: none; }
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

.modal {
  background: var(--white);
  border-radius: 20px;
  width: 92%; max-width: 420px;
  padding: 28px 24px;
  box-shadow: 0 24px 80px rgba(0,0,0,0.2);
  animation: slideUp 0.2s ease;
}
@keyframes slideUp {
  from { transform: translateY(20px) scale(0.97); opacity:0; }
  to   { transform: translateY(0) scale(1); opacity:1; }
}
.modal-title {
  font-family: 'Instrument Serif', serif;
  font-size: 26px; font-style: italic;
  margin-bottom: 6px; color: var(--text);
}
.modal-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 22px; line-height: 1.5; }

.field { margin-bottom: 16px; }
.field label { display: block; font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 6px; letter-spacing: 0.5px; text-transform: uppercase; }
.field input, .field textarea, .field select {
  width: 100%;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 14px;
  font-family: 'DM Sans', sans-serif;
  color: var(--text); outline: none;
  background: var(--bg);
  transition: border-color 0.2s;
}
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--text); background: #fff; }
.field textarea { resize: vertical; min-height: 80px; line-height: 1.55; }

/* emoji picker row */
.emoji-row {
  display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px;
}
.ep {
  width: 38px; height: 38px; border-radius: 10px;
  border: 1.5px solid var(--border);
  background: var(--bg); cursor: pointer; font-size: 20px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.12s;
}
.ep:hover, .ep.sel { border-color: var(--text); background: var(--text); }
.ep.sel { filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }

/* mood color row */
.color-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.cp {
  width: 32px; height: 32px; border-radius: 50%;
  border: 2px solid transparent; cursor: pointer;
  transition: transform 0.12s;
}
.cp:hover { transform: scale(1.15); }
.cp.sel { border-color: var(--text); transform: scale(1.15); }

.modal-btn {
  width: 100%; padding: 13px;
  border: none; border-radius: 12px;
  background: var(--text); color: #fff;
  font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 700;
  cursor: pointer; transition: all 0.15s; margin-top: 4px;
}
.modal-btn:hover { background: var(--accent); }
.modal-btn.sec { background: var(--bg); color: var(--text); margin-top: 8px; }
.modal-btn.sec:hover { background: var(--border); }
.modal-btn.danger { background: #fff0f1; color: var(--accent); }
.modal-btn.danger:hover { background: var(--accent); color: #fff; }

/* ============================
   RESPONSIVE
============================ */
@media (max-width: 900px) {
  .right-col { display: none; }
  .app { grid-template-columns: 232px 1fr; }
}
@media (max-width: 640px) {
  .left-nav { display: none; }
  .app { grid-template-columns: 1fr; }
  .chat-view {
    position: fixed;
    top: 0; left: 0; right: 0;
    bottom: 64px;
    height: auto;
    z-index: 50;
  }
  .back-btn { display: block; }
  body { padding-bottom: 64px; }
  .main { padding-bottom: 64px; }
}

/* ============================
   MOBILE BOTTOM NAV
============================ */
.mobile-nav {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 64px;
  background: var(--white);
  border-top: 1px solid var(--border);
  z-index: 100;
  padding: 0 8px;
  padding-bottom: env(safe-area-inset-bottom);
  align-items: center;
  justify-content: space-around;
}
@media (max-width: 640px) {
  .mobile-nav { display: flex; }
}
.mob-btn {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: none; border: none; cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  font-size: 10px; font-weight: 500;
  color: var(--text-muted);
  padding: 8px 12px;
  border-radius: 10px;
  transition: all 0.15s;
  flex: 1;
  min-width: 0;
}
.mob-btn:hover, .mob-btn.active { color: var(--text); }
.mob-icon {
  width: 32px; height: 32px;
  border-radius: 10px;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 17px;
  transition: background 0.15s;
}
.mob-btn.active .mob-icon { background: var(--text); }
.mob-btn:active { transform: scale(0.94); }
</style>
</head>
<body>

<!-- ===== API KEY MODAL ===== -->
<div class="overlay hidden" id="apikey-modal">
  <div class="modal">
    <div class="modal-title">🔑 API 설정</div>
    <div class="modal-sub">사용할 AI를 선택하고 API 키를 입력하세요. 키는 이 기기에만 저장돼요.</div>

    <!-- Provider tabs -->
    <div style="display:flex;gap:8px;margin-bottom:20px;">
      <button id="tab-claude" onclick="switchProvider('claude')"
        style="flex:1;padding:10px;border-radius:10px;border:2px solid var(--text);background:var(--text);color:#fff;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;">
        ✦ Claude
      </button>
      <button id="tab-gemini" onclick="switchProvider('gemini')"
        style="flex:1;padding:10px;border-radius:10px;border:2px solid var(--border);background:none;color:var(--text-muted);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;">
        ✦ Gemini
      </button>
    </div>

    <!-- Claude panel -->
    <div id="panel-claude">
      <div class="field">
        <label>Anthropic API Key</label>
        <input id="apikey-claude" type="password" placeholder="sk-ant-..." autocomplete="off">
      </div>
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:12px;">
        키 발급 → <a href="https://console.anthropic.com" target="_blank" style="color:var(--accent)">console.anthropic.com</a>
      </div>
    </div>

    <!-- Gemini panel -->
    <div id="panel-gemini" style="display:none;">
      <div class="field">
        <label>Google AI Studio API Key</label>
        <input id="apikey-gemini" type="password" placeholder="AIza..." autocomplete="off">
      </div>
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:12px;">
        키 발급 → <a href="https://aistudio.google.com/app/apikey" target="_blank" style="color:var(--accent)">aistudio.google.com</a>
      </div>
    </div>

    <div id="apikey-err" style="font-size:12px;color:var(--accent);margin-bottom:8px;min-height:16px;"></div>
    <button class="modal-btn" onclick="saveApiKey()">저장하기</button>
    <div style="font-size:11px;color:var(--text-muted);margin-top:12px;line-height:1.6;">⚠️ 브라우저에서 직접 API를 호출합니다. 개인 용도로만 사용하세요.</div>
  </div>
</div>

<!-- ===== CREATE CHARACTER MODAL ===== -->
<div class="overlay hidden" id="create-modal">
  <div class="modal">
    <div class="modal-title" id="modal-heading">새 AI 친구 만들기</div>
    <div class="modal-sub" id="modal-desc">나만의 캐릭터를 설정하고 대화를 시작해보세요.</div>

    <div class="field">
      <label>이름</label>
      <input id="c-name" type="text" placeholder="예: 민지, 우주인 박사, 고양이 나나" maxlength="20">
    </div>

    <div class="field">
      <label>아이콘 선택</label>
      <div class="emoji-row" id="emoji-row">
        <!-- filled by JS -->
      </div>
    </div>

    <div class="field">
      <label>색상 테마</label>
      <div class="color-row" id="color-row"></div>
    </div>

    <div class="field">
      <label>성격 / 역할</label>
      <textarea id="c-persona" placeholder="예: 20대 활발한 대학생 친구. 유행어를 자주 쓰고 항상 긍정적이야. 가끔 엉뚱한 말을 해서 웃겨줘."></textarea>
    </div>

    <div class="field">
      <label>말투 스타일</label>
      <select id="c-style">
        <option value="친근한 반말">친근한 반말 (야, 그렇지~)</option>
        <option value="귀여운 말투">귀여운 말투 (ㅋㅋ 맞아맞아~♥)</option>
        <option value="격식체">격식체 (안녕하세요! 물론이죠.)</option>
        <option value="무뚝뚝">무뚝뚝 (응, 그래, 몰라)</option>
        <option value="시적인 말투">시적인 말투 (빛처럼 흘러가는 말...)</option>
        <option value="재미있는 아재개그">아재개그형 (그게 뭐라고? 바나나!)</option>
      </select>
    </div>

    <div id="modal-err" style="font-size:12px;color:var(--accent);margin-bottom:8px;min-height:16px;"></div>
    <button class="modal-btn" onclick="saveChar()">✨ 만들기</button>
    <button class="modal-btn sec" onclick="closeModal()">취소</button>
  </div>
</div>

<!-- ===== CHAR OPTIONS MODAL ===== -->
<div class="overlay hidden" id="opts-modal">
  <div class="modal">
    <div class="modal-title">캐릭터 설정</div>
    <div class="modal-sub" id="opts-name-sub"></div>
    <button class="modal-btn" onclick="editChar()">✏️ 수정하기</button>
    <button class="modal-btn danger" style="margin-top:8px;" onclick="deleteChar()">🗑️ 삭제하기</button>
    <button class="modal-btn sec" onclick="closeOptsModal()">닫기</button>
  </div>
</div>

<div class="app">

  <!-- LEFT NAV -->
  <nav class="left-nav">
    <div class="logo">AI<span>gram</span></div>
    <button class="nav-btn active"><span class="nav-icon">🏠</span>홈</button>
    <button class="nav-btn"><span class="nav-icon">🔍</span>탐색</button>
    <button class="nav-btn"><span class="nav-icon">🎬</span>릴스</button>
    <button class="nav-btn" onclick="showDMList()"><span class="nav-icon">💬</span>메시지</button>
    <button class="nav-btn"><span class="nav-icon">🔔</span>알림</button>
    <button class="nav-btn" onclick="openCreate()"><span class="nav-icon">➕</span>만들기</button>
    <button class="nav-btn" onclick="openApiKeyModal()"><span class="nav-icon">🔑</span>API 키</button>
    <div class="nav-spacer"></div>
    <button class="new-char-btn" onclick="openCreate()">
      <span style="font-size:20px">🧑‍🎨</span>
      새 캐릭터 만들기
    </button>
  </nav>

  <!-- MAIN AREA -->
  <div class="main" style="position:relative; overflow:hidden;">

    <!-- DM list section -->
    <div class="dm-section" id="dm-section">
      <!-- Stories -->
      <div class="stories-bar">
        <div class="stories-row" id="stories-row"></div>
      </div>

      <!-- DM header -->
      <div class="dm-header">
        <span class="dm-title">메시지</span>
        <button class="dm-new-btn" title="새 대화" onclick="openCreate()">✏️</button>
      </div>

      <!-- DM list -->
      <div class="dm-list" id="dm-list">
        <!-- filled by JS -->
      </div>
    </div>

    <!-- Chat view (shown when character selected) -->
    <div class="chat-view" id="chat-view">

      <!-- empty state -->
      <div class="chat-empty" id="chat-empty">
        <div class="chat-empty-icon">💬</div>
        <h3>대화를 시작해보세요</h3>
        <p>왼쪽에서 AI 친구를 선택하거나<br>새로운 캐릭터를 만들어보세요.</p>
        <button class="start-btn" onclick="openCreate()">+ 새 캐릭터 만들기</button>
      </div>

      <!-- Actual chat (hidden until char selected) -->
      <div id="chat-inner" style="display:none; flex-direction:column; flex:1; overflow:hidden;">
        <div class="chat-header">
          <button class="back-btn" onclick="closeChatMobile()">←</button>
          <div class="chat-h-avatar" id="ch-av"></div>
          <div class="chat-h-info">
            <div class="chat-h-name" id="ch-name"></div>
            <div class="chat-h-sub" id="ch-sub">온라인 · AI 캐릭터</div>
          </div>
          <div class="chat-h-actions">
            <button class="h-btn" title="정보" onclick="openOpts()">⋯</button>
          </div>
        </div>

        <div class="chips" id="chips-row"></div>

        <div class="msgs-area" id="msgs-area">
          <div class="date-sep">오늘</div>
        </div>

        <div class="input-bar">
          <div class="input-wrap">
            <textarea id="chat-input" rows="1" placeholder="메시지 보내기..." onkeydown="onKey(event)" oninput="onInput(this)"></textarea>
          </div>
          <button class="send-btn" id="send-btn" onclick="send()" disabled>➤</button>
        </div>
      </div>

    </div>
  </div>

  <!-- RIGHT COL -->
  <div class="right-col">
    <div class="profile-mini">
      <div class="profile-av">😊</div>
      <div>
        <div class="profile-name">나</div>
        <div class="profile-sub">내 프로필 보기</div>
      </div>
    </div>

    <div class="suggest-title">AI 친구 추천</div>
    <div id="suggest-list"></div>
  </div>

</div>

<!-- ===== MOBILE BOTTOM NAV ===== -->
<nav class="mobile-nav" id="mobile-nav">
  <button class="mob-btn active" id="mob-home" onclick="mobileNav('home')">
    <div class="mob-icon">🏠</div>
    <span>홈</span>
  </button>
  <button class="mob-btn" id="mob-msgs" onclick="mobileNav('msgs')">
    <div class="mob-icon">💬</div>
    <span>메시지</span>
  </button>
  <button class="mob-btn" id="mob-create" onclick="openCreate()">
    <div class="mob-icon">➕</div>
    <span>만들기</span>
  </button>
  <button class="mob-btn" id="mob-api" onclick="openApiKeyModal()">
    <div class="mob-icon">🔑</div>
    <span>API 키</span>
  </button>
  <button class="mob-btn" id="mob-profile" onclick="openApiKeyModal()">
    <div class="mob-icon">😊</div>
    <span>프로필</span>
  </button>
</nav>

<script>
/* ============================
   STATE
============================ */
let chars = [];         // { id, name, emoji, color, persona, style, msgs:[], lastMsg }
let activeId = null;
let isTyping = false;
let editingId = null;   // for edit mode
let optsId = null;

const EMOJIS = ['🤖','🧑‍🎤','👩‍💻','🦊','🐱','🐼','🧚','🧙‍♂️','🧛','👾','🌸','⭐','🔥','🌈','🎭','🦋'];
const COLORS = [
  'linear-gradient(135deg,#667eea,#764ba2)',
  'linear-gradient(135deg,#f093fb,#f5576c)',
  'linear-gradient(135deg,#4facfe,#00f2fe)',
  'linear-gradient(135deg,#43e97b,#38f9d7)',
  'linear-gradient(135deg,#fa709a,#fee140)',
  'linear-gradient(135deg,#a18cd1,#fbc2eb)',
  'linear-gradient(135deg,#ffecd2,#fcb69f)',
  'linear-gradient(135deg,#30cfd0,#330867)',
];
const COLOR_DOTS = ['#667eea','#f5576c','#4facfe','#43e97b','#fa709a','#a18cd1','#fcb69f','#330867'];

let selEmoji = EMOJIS[0];
let selColor = COLORS[0];

const PRESETS = [
  { name:'민지', emoji:'🌸', color: COLORS[1], persona:'20대 대학생 친구. 항상 밝고 에너지 넘침. 최신 유행에 민감하고 셀카와 카페 투어를 좋아해.', style:'귀여운 말투' },
  { name:'닥터 박', emoji:'🧙‍♂️', color: COLORS[0], persona:'40대 박식한 AI 연구자. 논리적이고 친절하게 어떤 질문이든 심도 있게 답해줌.', style:'격식체' },
  { name:'냥냥이', emoji:'🐱', color: COLORS[4], persona:'말하는 고양이. 모든 것을 고양이 관점에서 보며 생선과 낮잠을 사랑함. 간간이 야옹 한마디.', style:'귀여운 말투' },
];

const SUGGESTION_PRESETS = [
  { name:'우주인 에코', emoji:'👾', color: COLORS[2], sub:'SF 탐험가 AI' },
  { name:'하루', emoji:'🦊', color: COLORS[4], sub:'장난꾸러기 AI' },
  { name:'소피아', emoji:'🧚', color: COLORS[5], sub:'감성 시인 AI' },
];

/* ============================
   INIT
============================ */
function init() {
  try {
    const s = localStorage.getItem('aigram_chars');
    if (s) chars = JSON.parse(s);
  } catch(e){}

  if (chars.length === 0) {
    // Add presets
    PRESETS.forEach(p => addChar(p.name, p.emoji, p.color, p.persona, p.style));
  }

  buildEmojiPicker();
  buildColorPicker();
  renderAll();
}

function save() {
  try { localStorage.setItem('aigram_chars', JSON.stringify(chars)); } catch(e){}
}

function addChar(name, emoji, color, persona, style) {
  const id = Date.now() + Math.random();
  chars.push({ id, name, emoji, color, persona, style, msgs: [], lastMsg: '' });
  save();
}

/* ============================
   RENDER
============================ */
function renderAll() {
  renderStories();
  renderDMList();
  renderSuggestions();
  if (activeId) openChat(activeId, false);
}

function renderStories() {
  const row = document.getElementById('stories-row');
  const addStory = `
    <div class="story-wrap">
      <div class="story-ring no-ring" onclick="openCreate()">
        <div class="story-inner" style="background:#f5f3f0; font-size:26px; cursor:pointer;">➕</div>
      </div>
      <span class="story-name">내 스토리</span>
    </div>`;
  const charStories = chars.map(c => `
    <div class="story-wrap" onclick="openChat('${c.id}')">
      <div class="story-ring">
        <div class="story-inner" style="background:${c.color}">${c.emoji}</div>
      </div>
      <span class="story-name">${c.name}</span>
    </div>`).join('');
  row.innerHTML = addStory + charStories;
}

function renderDMList() {
  const list = document.getElementById('dm-list');
  if (chars.length === 0) {
    list.innerHTML = `<div style="padding:30px 16px;text-align:center;color:var(--text-muted);font-size:13px;">아직 AI 친구가 없어요.<br>새로 만들어보세요! 🎨</div>`;
    return;
  }
  list.innerHTML = chars.map(c => `
    <div class="dm-item${activeId===c.id?' active':''}" onclick="openChat('${c.id}')">
      <div class="dm-avatar-ring">
        <div class="dm-avatar" style="background:${c.color};width:100%;height:100%;border-radius:50%;border:2px solid white;">${c.emoji}</div>
      </div>
      <div class="dm-info">
        <div class="dm-name">${c.name}</div>
        <div class="dm-preview">${c.lastMsg || '대화를 시작해보세요 ✨'}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
        <span class="dm-time">${c.msgs.length>0?'방금':''}</span>
        ${c.msgs.length===0?'<div class="dm-unread"></div>':''}
      </div>
    </div>`).join('');
}

function renderSuggestions() {
  const el = document.getElementById('suggest-list');
  const items = SUGGESTION_PRESETS.map((s,i) => `
    <div class="suggest-item">
      <div class="s-av" style="background:${s.color}">${s.emoji}</div>
      <div class="s-info">
        <div class="s-name">${s.name}</div>
        <div class="s-sub">${s.sub}</div>
      </div>
      <button class="s-follow" id="sf-${i}" onclick="quickAdd(${i},this)">${chars.find(c=>c.name===s.name)?'팔로잉':'팔로우'}</button>
    </div>`).join('');
  el.innerHTML = items;
}

/* ============================
   OPEN CHAT
============================ */
function openChat(id, scroll=true) {
  activeId = id;
  const c = chars.find(x => x.id == id);
  if (!c) return;

  document.getElementById('chat-empty').style.display = 'none';
  const inner = document.getElementById('chat-inner');
  inner.style.display = 'flex';

  // header
  const av = document.getElementById('ch-av');
  av.textContent = c.emoji;
  av.style.background = c.color;
  av.style.fontSize = '22px';
  document.getElementById('ch-name').textContent = c.name;
  document.getElementById('ch-sub').textContent = `온라인 · ${c.style}`;

  // chips
  const chips = [
    `안녕! 자기소개 해줘 👋`,
    `오늘 기분 어때? 😊`,
    `재미있는 이야기 해줘 🎉`,
    `나 고민이 있어 🤔`,
  ];
  document.getElementById('chips-row').innerHTML = chips.map(ch =>
    `<button class="chip" onclick="sendChip(this)">${ch}</button>`
  ).join('');
  document.getElementById('chips-row').style.display = '';

  // messages
  const area = document.getElementById('msgs-area');
  area.innerHTML = '<div class="date-sep">오늘</div>';
  c.msgs.forEach(m => renderBubble(m.role, m.content, false));

  if (c.msgs.length === 0) addWelcome(c);
  else { area.scrollTop = area.scrollHeight; }

  // active state
  document.querySelectorAll('.dm-item').forEach(el => el.classList.remove('active'));
  const dmEl = [...document.querySelectorAll('.dm-item')].find(el =>
    el.getAttribute('onclick').includes(`'${id}'`)
  );
  if (dmEl) dmEl.classList.add('active');

  // mobile: show chat
  document.getElementById('chat-view').classList.add('open');
  setMobileActiveBtn('mob-msgs');
}

function showDMList() {
  closeChatMobile();
  setMobileActiveBtn('mob-msgs');
}

function mobileNav(tab) {
  if (tab === 'home') {
    closeChatMobile();
    setMobileActiveBtn('mob-home');
  } else if (tab === 'msgs') {
    closeChatMobile();
    setMobileActiveBtn('mob-msgs');
  }
}

function setMobileActiveBtn(id) {
  document.querySelectorAll('.mob-btn').forEach(b => b.classList.remove('active'));
  const el = document.getElementById(id);
  if (el) el.classList.add('active');
}

function closeChatMobile() {
  document.getElementById('chat-view').classList.remove('open');
}

/* ============================
   MESSAGES
============================ */
function addWelcome(c) {
  const greetings = [
    `야, 왔어? 나 ${c.name}이야~ 반가워! 뭐 얘기하고 싶어? 😊`,
    `안녕! 나야 나, ${c.name}! 뭔가 재밌는 거 얘기해봐 ✨`,
    `오, ${c.name} 여기 있어요! 무슨 말씀이든 편하게 해요 🌸`,
  ];
  const g = greetings[Math.floor(Math.random() * greetings.length)];
  renderBubble('ai', g);
  const c2 = chars.find(x => x.id == activeId);
  if (c2) {
    c2.msgs.push({ role:'ai', content: g });
    c2.lastMsg = g.length > 30 ? g.slice(0,30)+'...' : g;
    save(); renderDMList();
  }
}

function renderBubble(role, text, animate=true) {
  const area = document.getElementById('msgs-area');
  const isMe = role === 'user';
  const c = chars.find(x => x.id == activeId);
  if (!c) return;

  const row = document.createElement('div');
  row.className = 'msg-row ' + (isMe ? 'me' : 'them');
  if (!animate) row.style.animation = 'none';

  const safe = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  const t = new Date(); const ts = t.getHours().toString().padStart(2,'0')+':'+t.getMinutes().toString().padStart(2,'0');

  row.innerHTML = `
    ${!isMe ? `<div class="msg-av" style="background:${c.color}">${c.emoji}</div>` : ''}
    <div class="bwrap">
      <div class="bubble ${isMe?'me':'them'}">${safe}</div>
      <span class="msg-time">${ts}</span>
    </div>
    ${isMe ? `<div class="msg-av" style="background:linear-gradient(135deg,#ffecd2,#fcb69f)">😊</div>` : ''}
  `;
  area.appendChild(row);
  area.scrollTop = area.scrollHeight;
}

function showTyping() {
  const area = document.getElementById('msgs-area');
  const c = chars.find(x => x.id == activeId);
  const row = document.createElement('div');
  row.className = 'msg-row them'; row.id = 'typing-row';
  row.innerHTML = `
    <div class="msg-av" style="background:${c.color}">${c.emoji}</div>
    <div class="bwrap"><div class="bubble them typing-bub"><div class="dots"><span></span><span></span><span></span></div></div></div>
  `;
  area.appendChild(row); area.scrollTop = area.scrollHeight;
}

function removeTyping() { const r = document.getElementById('typing-row'); if(r) r.remove(); }

/* ============================
   SEND & API
============================ */
function onKey(e) {
  if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); send(); }
}
function onInput(el) {
  el.style.height='auto'; el.style.height = Math.min(el.scrollHeight,100)+'px';
  document.getElementById('send-btn').disabled = !el.value.trim();
}
function sendChip(btn) {
  document.getElementById('chips-row').style.display = 'none';
  sendText(btn.textContent.trim());
}
function send() {
  const inp = document.getElementById('chat-input');
  const t = inp.value.trim(); if (!t || isTyping) return;
  inp.value = ''; inp.style.height='auto';
  document.getElementById('send-btn').disabled = true;
  document.getElementById('chips-row').style.display = 'none';
  sendText(t);
}
async function sendText(text) {
  if (!activeId) return;
  const c = chars.find(x => x.id == activeId);
  if (!c) return;
  if (!localStorage.getItem('aigram_provider') && !localStorage.getItem('aigram_api_key_claude') && !localStorage.getItem('aigram_api_key') ) { openApiKeyModal(); return; }
  const _prov = localStorage.getItem('aigram_provider') || 'claude';
  const _key = _prov === 'gemini' ? localStorage.getItem('aigram_api_key_gemini') : (localStorage.getItem('aigram_api_key_claude') || localStorage.getItem('aigram_api_key'));
  if (!_key) { openApiKeyModal(); return; }

  renderBubble('user', text);
  c.msgs.push({ role:'user', content: text });
  c.lastMsg = text.length > 30 ? text.slice(0,30)+'...' : text;
  save(); renderDMList();

  isTyping = true; showTyping();

  try {
    const reply = await callAI(c, text);
    removeTyping();
    renderBubble('ai', reply);
    c.msgs.push({ role:'ai', content: reply });
    c.lastMsg = reply.length > 30 ? reply.slice(0,30)+'...' : reply;
    save(); renderDMList();
  } catch(err) {
    removeTyping();
    if (err.message === 'RATE_LIMIT') {
      renderBubble('ai', `⏳ 앗, 잠깐만... 지금 너무 많은 대화를 했나봐. API 사용량 한도에 걸렸어.${err.retryMsg || ' 잠시 후에 다시 말 걸어줘!'} 💤`);
    } else {
      renderBubble('ai', `⚠️ 오류가 났어... (${err.message}) 잠깐 있다가 다시 얘기해줘?`);
    }
  }
  isTyping = false;
  document.getElementById('send-btn').disabled = false;
}

/* ============================
   CREATE / EDIT CHAR MODAL
============================ */
function buildEmojiPicker() {
  document.getElementById('emoji-row').innerHTML = EMOJIS.map(e =>
    `<button class="ep${e===selEmoji?' sel':''}" onclick="pickEmoji('${e}',this)">${e}</button>`
  ).join('');
}
function buildColorPicker() {
  document.getElementById('color-row').innerHTML = COLOR_DOTS.map((dot,i) =>
    `<div class="cp${i===0?' sel':''}" style="background:${dot}" onclick="pickColor(${i},this)" title="${dot}"></div>`
  ).join('');
}

function pickEmoji(e, el) {
  selEmoji = e;
  document.querySelectorAll('.ep').forEach(b => b.classList.remove('sel'));
  el.classList.add('sel');
}
function pickColor(i, el) {
  selColor = COLORS[i];
  document.querySelectorAll('.cp').forEach(b => b.classList.remove('sel'));
  el.classList.add('sel');
}

function openCreate() {
  editingId = null;
  selEmoji = EMOJIS[0]; selColor = COLORS[0];
  document.getElementById('modal-heading').textContent = '새 AI 친구 만들기';
  document.getElementById('modal-desc').textContent = '나만의 캐릭터를 설정하고 대화를 시작해보세요.';
  document.getElementById('c-name').value = '';
  document.getElementById('c-persona').value = '';
  document.getElementById('c-style').value = '친근한 반말';
  document.getElementById('modal-err').textContent = '';
  buildEmojiPicker(); buildColorPicker();
  document.getElementById('create-modal').classList.remove('hidden');
}

function closeModal() { document.getElementById('create-modal').classList.add('hidden'); }

function saveChar() {
  const name = document.getElementById('c-name').value.trim();
  const persona = document.getElementById('c-persona').value.trim();
  const style = document.getElementById('c-style').value;
  const err = document.getElementById('modal-err');

  if (!name) { err.textContent = '이름을 입력해주세요.'; return; }
  if (!persona) { err.textContent = '성격/역할을 설명해주세요.'; return; }
  err.textContent = '';

  if (editingId) {
    const c = chars.find(x => x.id == editingId);
    if (c) { c.name=name; c.emoji=selEmoji; c.color=selColor; c.persona=persona; c.style=style; }
  } else {
    addChar(name, selEmoji, selColor, persona, style);
  }
  save(); renderAll(); closeModal();

  // open the newly created char
  if (!editingId) {
    const newest = chars[chars.length-1];
    openChat(newest.id);
  }
}

/* ============================
   CHAR OPTIONS MODAL
============================ */
function openOpts() {
  optsId = activeId;
  const c = chars.find(x => x.id == activeId);
  if (!c) return;
  document.getElementById('opts-name-sub').textContent = `${c.emoji} ${c.name}`;
  document.getElementById('opts-modal').classList.remove('hidden');
}
function closeOptsModal() { document.getElementById('opts-modal').classList.add('hidden'); }

function editChar() {
  closeOptsModal();
  const c = chars.find(x => x.id == optsId);
  if (!c) return;
  editingId = optsId;
  selEmoji = c.emoji;
  selColor = c.color;
  document.getElementById('modal-heading').textContent = '캐릭터 수정';
  document.getElementById('modal-desc').textContent = '내용을 수정하고 저장하세요.';
  document.getElementById('c-name').value = c.name;
  document.getElementById('c-persona').value = c.persona;
  document.getElementById('c-style').value = c.style;
  document.getElementById('modal-err').textContent = '';
  buildEmojiPicker(); buildColorPicker();
  // mark selected emoji
  document.querySelectorAll('.ep').forEach(btn => {
    btn.classList.toggle('sel', btn.textContent === selEmoji);
  });
  // mark selected color
  const ci = COLORS.indexOf(selColor);
  document.querySelectorAll('.cp').forEach((btn,i) => btn.classList.toggle('sel', i===ci));
  document.getElementById('create-modal').classList.remove('hidden');
}

function deleteChar() {
  if (!confirm(`정말 삭제할까요?`)) return;
  chars = chars.filter(x => x.id != optsId);
  save();
  if (activeId == optsId) {
    activeId = null;
    document.getElementById('chat-inner').style.display = 'none';
    document.getElementById('chat-empty').style.display = '';
    document.getElementById('chat-view').classList.remove('open');
  }
  closeOptsModal(); renderAll();
}

/* ============================
   QUICK ADD from suggestions
============================ */
function quickAdd(i, btn) {
  const s = SUGGESTION_PRESETS[i];
  if (chars.find(c => c.name === s.name)) return;
  const personas = [
    '우주를 탐험하는 SF 탐험가. 모든 것을 우주 탐험에 비유하고 미래 기술에 흥분함.',
    '장난꾸러기 여우 캐릭터. 장난을 치고 놀리길 좋아하지만 결국 따뜻하게 도와줌.',
    '감성적인 시인. 모든 대화를 시적으로 표현하고 아름다운 언어를 구사함.',
  ];
  const styles = ['친근한 반말','귀여운 말투','시적인 말투'];
  addChar(s.name, s.emoji, s.color, personas[i], styles[i]);
  btn.textContent = '팔로잉'; btn.classList.add('on');
  renderStories(); renderDMList();
  openChat(chars[chars.length-1].id);
}

/* close modals on overlay click — wrapped in DOMContentLoaded for safety */
function attachModalListeners() {
  const cm = document.getElementById('create-modal');
  if (cm) cm.addEventListener('click', function(e) { if (e.target === this) closeModal(); });
  const om = document.getElementById('opts-modal');
  if (om) om.addEventListener('click', function(e) { if (e.target === this) closeOptsModal(); });
  const am = document.getElementById('apikey-modal');
  if (am) am.addEventListener('click', function(e) { if (e.target === this) closeApiKeyModal(); });
}

/* ============================
   API KEY MODAL
============================ */
let activeProvider = localStorage.getItem('aigram_provider') || 'claude';

function switchProvider(p) {
  activeProvider = p;
  document.getElementById('panel-claude').style.display = p === 'claude' ? '' : 'none';
  document.getElementById('panel-gemini').style.display = p === 'gemini' ? '' : 'none';
  const tClaude = document.getElementById('tab-claude');
  const tGemini = document.getElementById('tab-gemini');
  if (p === 'claude') {
    tClaude.style.cssText += ';border-color:var(--text);background:var(--text);color:#fff;';
    tGemini.style.cssText += ';border-color:var(--border);background:none;color:var(--text-muted);';
  } else {
    tGemini.style.cssText += ';border-color:var(--text);background:var(--text);color:#fff;';
    tClaude.style.cssText += ';border-color:var(--border);background:none;color:var(--text-muted);';
  }
  document.getElementById('apikey-err').textContent = '';
}

function openApiKeyModal() {
  document.getElementById('apikey-claude').value = localStorage.getItem('aigram_api_key_claude') || '';
  document.getElementById('apikey-gemini').value = localStorage.getItem('aigram_api_key_gemini') || '';
  activeProvider = localStorage.getItem('aigram_provider') || 'claude';
  switchProvider(activeProvider);
  document.getElementById('apikey-modal').classList.remove('hidden');
}
function closeApiKeyModal() {
  document.getElementById('apikey-modal').classList.add('hidden');
}
function saveApiKey() {
  const err = document.getElementById('apikey-err');
  if (activeProvider === 'claude') {
    const key = document.getElementById('apikey-claude').value.trim();
    if (!key) { err.textContent = 'Claude API 키를 입력해주세요.'; return; }
    localStorage.setItem('aigram_api_key_claude', key);
  } else {
    const key = document.getElementById('apikey-gemini').value.trim();
    if (!key) { err.textContent = 'Gemini API 키를 입력해주세요.'; return; }
    localStorage.setItem('aigram_api_key_gemini', key);
  }
  localStorage.setItem('aigram_provider', activeProvider);
  err.textContent = '';
  closeApiKeyModal();
}

async function callAI(c, lastMsg) {
  const system = `너는 "${c.name}"이라는 AI 캐릭터야.
성격/역할: ${c.persona}
말투: ${c.style}

중요 규칙:
- 항상 위 성격과 말투를 유지해. 절대 "저는 AI입니다"라고 말하지 마.
- 인스타그램 DM처럼 자연스럽고 짧게 대화해. 너무 길게 쓰지 마.
- 감정을 표현할 때 이모지를 적절히 사용해.
- 반드시 한국어로만 대화해.`;

  const history = c.msgs.slice(-20).map(m => ({
    role: m.role === 'user' ? 'user' : 'assistant',
    content: m.content
  }));
  if (history.length > 0 && history[history.length-1].role === 'user') {
    history[history.length-1].content = lastMsg;
  }

  const provider = localStorage.getItem('aigram_provider') || 'claude';

  if (provider === 'gemini') {
    return await callGemini(system, history, lastMsg);
  } else {
    return await callClaude(system, history);
  }
}

async function callClaude(system, history) {
  const key = localStorage.getItem('aigram_api_key_claude') || localStorage.getItem('aigram_api_key') || '';
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
      'x-api-key': key
    },
    body: JSON.stringify({ model: 'claude-haiku-4-5-20251001', max_tokens: 600, system, messages: history })
  });
  if (!res.ok) {
    const e = await res.json().catch(()=>({}));
    const errType = e?.error?.type || e?.type;
    const resetsAt = e?.resetsAt || e?.error?.resetsAt;
    if (res.status === 429 || errType === 'exceeded_limit' || errType === 'rate_limit_error') {
      let retryMsg = '';
      if (resetsAt) {
        const diffMin = Math.ceil((new Date(resetsAt*1000) - new Date()) / 60000);
        retryMsg = diffMin > 60 ? ` 약 ${Math.ceil(diffMin/60)}시간 후에 다시 시도해줘.` : diffMin > 0 ? ` 약 ${diffMin}분 후에 다시 시도해줘.` : '';
      }
      const err = new Error('RATE_LIMIT'); err.retryMsg = retryMsg; throw err;
    }
    throw new Error(e?.error?.message || `HTTP ${res.status}`);
  }
  const data = await res.json();
  return data.content?.[0]?.text || '(응답 없음)';
}

async function callGemini(system, history) {
  const key = localStorage.getItem('aigram_api_key_gemini') || '';
  const geminiHistory = history.map(m => ({
    role: m.role === 'assistant' ? 'model' : 'user',
    parts: [{ text: m.content }]
  }));

  // AQ. 키는 x-goog-api-key 헤더로, AIza 키는 쿼리 파라미터로 전달
  const isAQKey = key.startsWith('AQ.');
  const url = isAQKey
    ? 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent'
    : `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`;

  const headers = { 'Content-Type': 'application/json' };
  if (isAQKey) headers['x-goog-api-key'] = key;

  const res = await fetch(url, {
    method: 'POST',
    headers,
    body: JSON.stringify({
      system_instruction: { parts: [{ text: system }] },
      contents: geminiHistory,
      generationConfig: { maxOutputTokens: 600 }
    })
  });
  if (!res.ok) {
    const e = await res.json().catch(()=>({}));
    if (res.status === 429) { const err = new Error('RATE_LIMIT'); err.retryMsg = ''; throw err; }
    throw new Error(e?.error?.message || `HTTP ${res.status}`);
  }
  const data = await res.json();
  return data.candidates?.[0]?.content?.parts?.[0]?.text || '(응답 없음)';
}

document.addEventListener('DOMContentLoaded', function() {
  attachModalListeners();
  init();
  const _hasKey = localStorage.getItem('aigram_api_key_claude') || localStorage.getItem('aigram_api_key_gemini') || localStorage.getItem('aigram_api_key');
  if (!_hasKey) { openApiKeyModal(); }
});
</script>
